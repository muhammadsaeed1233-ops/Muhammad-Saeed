<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUHAMMAD SAEED | Digital Portfolio</title>

  <!-- Font + Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at top,#1a1f3a,#05060d);
    }

    .card{
      width:92%;
      max-width:950px;
      padding:45px;
      border-radius:30px;
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 0 60px rgba(0,0,0,0.6);
      text-align:center;
      color:white;
    }

    h1{
      font-size:clamp(32px,5vw,65px);
      background:linear-gradient(90deg,#ffcc00,#ff4d8d,#00e5ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:10px;
    }

    p{
      color:#cbd5e1;
      font-size:16px;
      margin-bottom:25px;
    }

    .icons{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:15px;
      margin-top:10px;
    }

    .icons a{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 18px;
      border-radius:50px;
      text-decoration:none;
      color:white;
      font-size:14px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      transition:0.3s;
    }

    .icons a i{
      font-size:18px;
    }

    .icons a:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.18);
      box-shadow:0 10px 25px rgba(0,0,0,0.4);
    }

    .instagram i{color:#ff4d8d;}
    .tiktok i{color:#ffffff;}
    .youtube i{color:#ff0000;}
    .facebook i{color:#1877f2;}
    .snapchat i{color:#fffc00;}

    .footer{
      margin-top:25px;
      font-style:italic;
      color:#94a3b8;
      font-size:15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>MUHAMMAD SAEED</h1>
    <p>Digital Creator • Influencer</p>

    <div class="icons">
      <a class="instagram" href="https://www.instagram.com/mr_saeed_arain1?igsh=MWt5a294aTR2NmFqMA==" target="_blank">
        <i class="fab fa-instagram"></i> Instagram
      </a>

      <a class="tiktok" href="https://www.tiktok.com/@its_me_saeed2?_r=1&_t=ZS-96cY6rfeU1Y" target="_blank">
        <i class="fab fa-tiktok"></i> TikTok
      </a>

      <a class="youtube" href="https://youtube.com/@MuhammadSaeedStudio" target="_blank">
        <i class="fab fa-youtube"></i> YouTube
      </a>

      <a class="facebook" href="https://www.facebook.com/share/18xWqknwsZ/" target="_blank">
        <i class="fab fa-facebook"></i> Facebook
      </a>

      <a class="snapchat" href="https://www.snapchat.com/add/saeedarain20708?share_id=QlFv-35crpM&locale=en-GB" target="_blank">
        <i class="fab fa-snapchat"></i> Snapchat
      </a>
    </div>

    <div class="footer">
      “Elegance, creativity, and ambition define MUHAMMAD SAEED.”
    </div>
  </div>

</body>
</html>
