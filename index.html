<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUHAMMAD SAEED | Digital App Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#0b0f1a;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .app{
      width:360px;
      height:720px;
      background:#111827;
      border-radius:35px;
      box-shadow:0 0 40px rgba(0,0,0,0.8);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      color:white;
      padding:18px;
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:42px;
      height:42px;
      background:linear-gradient(135deg,#ff4d8d,#00e5ff);
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
    }

    .title{
      font-size:13px;
      opacity:0.8;
    }

    .profile{
      text-align:center;
      margin-top:10px;
    }

    .avatar{
      width:90px;
      height:90px;
      border-radius:50%;
      margin:10px auto;
      background:linear-gradient(135deg,#ff4d8d,#00e5ff);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:bold;
    }

    .profile h2{
      margin-top:8px;
      font-size:20px;
    }

    .profile p{
      font-size:13px;
      opacity:0.7;
    }

    .social{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:15px;
      overflow-y:auto;
      padding-right:5px;
    }

    .social a{
      background:rgba(255,255,255,0.08);
      padding:12px;
      border-radius:12px;
      text-decoration:none;
      color:white;
      display:flex;
      gap:10px;
      align-items:center;
      transition:0.3s;
      font-size:14px;
    }

    .social a:hover{
      transform:scale(1.03);
      background:rgba(255,255,255,0.15);
    }

    .instagram i{color:#ff4d8d;}
    .tiktok i{color:#ffffff;}
    .youtube i{color:#ff0000;}
    .facebook i{color:#1877f2;}
    .snapchat i{color:#fffc00;}

    .bottomnav{
      display:flex;
      justify-content:space-around;
      padding:12px;
      background:rgba(255,255,255,0.06);
      border-radius:20px;
      font-size:12px;
    }

    .bottomnav div{
      opacity:0.8;
    }

    .music{
      position:absolute;
      top:12px;
      right:12px;
    }

    .music button{
      padding:8px 12px;
      border-radius:20px;
      border:none;
      cursor:pointer;
      background:linear-gradient(90deg,#ff4d8d,#00e5ff);
      color:white;
      font-size:12px;
      font-weight:600;
    }

    audio{display:none;}
  </style>
</head>
<body>

<div class="app">

  <div class="music">
    <button onclick="toggleMusic()">🎵 Play</button>
    <audio id="bgmusic" loop>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="topbar">
    <div class="logo">MS</div>
    <div class="title">MUHAMMAD SAEED • Digital App Portfolio</div>
  </div>

  <div class="profile">
    <div class="avatar">MS</div>
    <h2>MUHAMMAD SAEED</h2>
    <p>Digital Creator • Influencer • Brand Builder</p>
  </div>

  <div class="social">
    <a href="https://www.instagram.com/mr_saeed_arain1?igsh=MWt5a294aTR2NmFqMA==" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <a href="https://www.tiktok.com/@its_me_saeed2?_r=1&_t=ZS-96cY6rfeU1Y" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
    <a href="https://youtube.com/@MuhammadSaeedStudio" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
    <a href="https://www.facebook.com/share/18xWqknwsZ/" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
    <a href="https://www.snapchat.com/add/saeedarain20708?share_id=QlFv-35crpM&locale=en-GB" target="_blank"><i class="fab fa-snapchat"></i> Snapchat</a>
  </div>

  <div class="bottomnav">
    <div>🏠 Home</div>
    <div>⭐ Social</div>
    <div>👤 Profile</div>
  </div>

</div>

<script>
function toggleMusic(){
  const music = document.getElementById('bgmusic');
  const btn = document.querySelector('.music button');

  if(music.paused){
    music.play();
    btn.innerHTML = "⏸ Pause";
  } else {
    music.pause();
    btn.innerHTML = "🎵 Play";
  }
}
</script>

</body>
</html>
